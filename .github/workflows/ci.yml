name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Format + Test + Dialyzer (Elixir ${{ matrix.elixir }} / OTP ${{ matrix.otp }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - elixir: "1.15.8"
            otp: "26.2"
          - elixir: "1.20.0"
            otp: "27.0"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Checkout matching contract harness
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: ArchAstro/archastro-openapi
          ref: features/calvin-archastro-06-08-2026-elixir-sdk
          path: .ci/archastro-openapi

      - name: Setup Node (for prism + @archastro/channel-harness)
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24.18"
          cache: npm

      - run: npm ci --ignore-scripts

      - name: Audit JS tooling dependencies
        run: npm audit --audit-level=moderate

      - name: Build matching contract harness
        run: |
          npm ci
          npm run build
        working-directory: .ci/archastro-openapi

      - name: Setup Elixir ${{ matrix.elixir }} / OTP ${{ matrix.otp }}
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1
        with:
          elixir-version: ${{ matrix.elixir }}
          otp-version: ${{ matrix.otp }}

      - run: mix deps.get

      - name: Format check
        run: mix format --check-formatted

      - name: Compile with warnings as errors
        run: mix compile --warnings-as-errors

      - name: Tests (unit + REST + SSE contract)
        run: mix test --warnings-as-errors

      - name: Channel contract tests (real harness subprocess)
        run: mix test test/contract --only channel_contract --warnings-as-errors
        env:
          ARCHASTRO_HARNESS_BIN: ${{ github.workspace }}/.ci/archastro-openapi/packages/channel-harness/dist/bin.js
          ARCHASTRO_RUN_CHANNEL_CONTRACT_TESTS: "1"

      - name: Dialyzer
        run: mix dialyzer
