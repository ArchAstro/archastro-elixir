name: Publish

# Publishes to Hex with the repository's HEX_API_KEY Actions secret.
# Create a write-scoped Hex key, then add it with:
#   gh secret set HEX_API_KEY --repo ArchAstro/archastro-elixir

on:
  push:
    tags:
      - "v*"
  # release.yml dispatches this at the tag because tags pushed by GITHUB_TOKEN
  # do not themselves trigger workflows.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    name: Publish archastro to Hex
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1
        with:
          elixir-version: "1.20.0"
          otp-version: "27.0"

      - run: mix local.hex --force
      - run: mix deps.get

      - name: Verify tag matches package version
        id: release
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          case "$TAG" in
            v[0-9]*.[0-9]*.[0-9]*) version=${TAG#v} ;;
            *) echo "Expected a vX.Y.Z tag, got: $TAG" >&2; exit 1 ;;
          esac

          # Avoid first-run compiler output contaminating the captured version.
          actual=$(mix run --no-compile --no-start -e 'IO.write(Mix.Project.config()[:version])')
          if [ "$actual" != "$version" ]; then
            echo "Version mismatch: tag says $version, mix.exs says $actual" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build package
        run: mix hex.build

      - name: Publish to Hex
        env:
          HEX_API_KEY: ${{ secrets.HEX_API_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$HEX_API_KEY" ]; then
            echo "HEX_API_KEY repository secret is not configured" >&2
            exit 1
          fi
          mix hex.publish --yes

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          gh release create "$TAG" \
            --title "archastro v$VERSION" \
            --notes "Published to Hex: https://hex.pm/packages/archastro/$VERSION" \
            --generate-notes
