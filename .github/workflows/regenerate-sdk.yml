name: Regenerate SDK

# Manually regenerate from archastro-openapi. Changes are force-pushed to one
# stable automation branch, then opened or updated as a reviewable PR.

on:
  workflow_dispatch:
    inputs:
      openapi_ref:
        description: archastro-openapi git ref to pull the spec from
        required: false
        default: main
      generator_spec:
        description: npm spec for @archastro/sdk-generator
        required: false
        default: "@archastro/sdk-generator@latest"

permissions:
  contents: write
  pull-requests: write

env:
  AUTO_BRANCH: auto/regenerate-sdk

jobs:
  regenerate:
    name: Regenerate + open PR
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24.18"
          cache: npm

      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1
        with:
          elixir-version: "1.20.0"
          otp-version: "27.0"

      - run: npm ci --ignore-scripts
      - run: mix deps.get

      - name: Install requested generator
        env:
          GENERATOR_SPEC: ${{ inputs.generator_spec }}
        run: npm install --no-save --package-lock=false --ignore-scripts "$GENERATOR_SPEC"

      - name: Regenerate SDK
        env:
          ARCHASTRO_OPENAPI_REF: ${{ inputs.openapi_ref }}
        run: ./scripts/regenerate_sdk.sh

      - name: Detect changes
        id: diff
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No changes from regeneration; nothing to do."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git status --short
          fi

      - name: Resolve generator version
        if: steps.diff.outputs.changed == 'true'
        id: generator
        run: echo "version=$(node -p "require('./node_modules/@archastro/sdk-generator/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Commit + force-push automation branch
        if: steps.diff.outputs.changed == 'true'
        env:
          OPENAPI_REF: ${{ inputs.openapi_ref }}
          GENERATOR_VERSION: ${{ steps.generator.outputs.version }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$AUTO_BRANCH"
          git add -A
          git commit -m "chore(sdk): regenerate from archastro-openapi@$OPENAPI_REF (generator $GENERATOR_VERSION)"
          git push --force-with-lease origin "$AUTO_BRANCH"

      - name: Open or update PR
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENAPI_REF: ${{ inputs.openapi_ref }}
          GENERATOR_SPEC: ${{ inputs.generator_spec }}
          GENERATOR_VERSION: ${{ steps.generator.outputs.version }}
        run: |
          set -euo pipefail
          file_count=$(git diff --name-only HEAD~1 HEAD | wc -l | tr -d ' ')
          body=$(cat <<EOF
          Automated Elixir SDK regeneration.

          - archastro-openapi ref: \`$OPENAPI_REF\`
          - generator: \`$GENERATOR_SPEC\` (resolved to \`$GENERATOR_VERSION\`)
          - changed files: $file_count

          Review the generated diff carefully. The PR's CI validates formatting, compilation, tests, contracts, and Dialyzer.
          EOF
          )

          existing=$(gh pr list --head "$AUTO_BRANCH" --state open --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh pr edit "$existing" --title "chore(sdk): regenerate from openapi@$OPENAPI_REF" --body "$body"
          else
            gh pr create \
              --base main \
              --head "$AUTO_BRANCH" \
              --title "chore(sdk): regenerate from openapi@$OPENAPI_REF" \
              --body "$body"
          fi
